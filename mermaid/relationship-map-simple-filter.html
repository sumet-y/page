<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mermaid Diagram</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    background: #fff;
    overflow: hidden;
  }
  .toolbar {
    padding: 6px 10px;
    background: #fafafa;
    border-bottom: 1px solid #eee;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }
  .zoom-label { font-size: 13px; color: #555; min-width: 42px; text-align: center; }
  button {
    padding: 5px 11px;
    cursor: pointer;
    border: 1px solid #bbb;
    background: #fff;
    border-radius: 4px;
    font-size: 13px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  button:hover { background: #f0f0f0; }
  button:active { background: #e8e8e8; }
  #preview {
    flex: 1;
    overflow: scroll;
    -webkit-overflow-scrolling: touch;
    padding: 20px;
    min-height: 0;
    touch-action: pan-x pan-y;
  }
  #preview-inner {
    display: inline-block;
    transform-origin: top left;
    transition: transform 0.15s ease;
    touch-action: manipulation;
  }
  #preview-inner svg { display: block; }
</style>
</head>
<body>
<div class="toolbar" style="flex-wrap:wrap;">
  <button onclick="showSOP('ALL')">ทั้งหมด</button>
  <button onclick="showSOP('P')" style="border-color:#E53935;color:#E53935;">🔴 Problem</button>
  <button onclick="showSOP('S')" style="border-color:#1976D2;color:#1976D2;">🔵 Software</button>
  <button onclick="showSOP('Q')" style="border-color:#43A047;color:#43A047;">🟢 Procurement</button>
  <button onclick="showSOP('C')" style="border-color:#FB8C00;color:#FB8C00;">🟠 Change</button>
  <button onclick="showSOP('A')" style="border-color:#8E24AA;color:#8E24AA;">🟣 Access</button>
  <span style="margin-left:8px;color:#666;font-size:12px;">คลิกสี = แสดงเฉพาะ SOP นั้น</span>
  <span style="margin-left:auto"></span>
  <button onclick="zoomIn()">🔍＋</button>
  <button onclick="zoomOut()">🔍－</button>
  <button onclick="resetZoom()">↺ Reset</button>
  <span class="zoom-label" id="zoomLabel">100%</span>
</div>
<div id="preview">

<script>
  const previewInner = document.getElementById("preview-inner");
  const previewEl = document.getElementById("preview");
  const zoomLabel = document.getElementById("zoomLabel");
  let zoomLevel = 1;
  const ZOOM_STEP = 0.15, ZOOM_MIN = 0.2, ZOOM_MAX = 10;

  function applyZoom() {
    previewInner.style.transform = "scale(" + zoomLevel + ")";
    zoomLabel.textContent = Math.round(zoomLevel * 100) + "%";
  }
  function zoomIn() { zoomLevel = Math.min(ZOOM_MAX, +(zoomLevel + ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomOut() { zoomLevel = Math.max(ZOOM_MIN, +(zoomLevel - ZOOM_STEP).toFixed(2)); applyZoom(); }
  function resetZoom() { zoomLevel = 1; applyZoom(); }

  previewEl.addEventListener("wheel", (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      e.deltaY < 0 ? zoomIn() : zoomOut();
    }
  }, { passive: false });

  let lastTap = 0;
  previewEl.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });
</script>

<style>
  /* Simple SOP filter */
  #graphDiv .sop-hidden {
    display: none !important;
  }
</style>

<script>
function showSOP(sop) {
  // Mermaid generated edge IDs in this file use:
  // L-P-... = Problem
  // L-S-... = Software
  // L-Q-... = Procurement
  // L-C-... = Change
  // L-A-... = Access

  const edges = document.querySelectorAll('#graphDiv .edgePath');

  edges.forEach(function(edge) {
    if (sop === 'ALL') {
      edge.classList.remove('sop-hidden');
      return;
    }

    const id = edge.id || '';
    const keep = id.indexOf('L-' + sop + '-') === 0;

    if (keep) {
      edge.classList.remove('sop-hidden');
    } else {
      edge.classList.add('sop-hidden');
    }
  });

  // Also hide edge labels belonging to the other SOPs when present.
  // This version mainly targets the colored relationship lines.
}
</script>
