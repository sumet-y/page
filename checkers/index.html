<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>หมากฮอสไทย — เล่นสูตร</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
:root{
  --bg:#f5f0e8;--panel:#fff;--border:#c8b89a;
  --accent:#c0392b;--gold:#b8860b;
  --light-sq:#f0d9b5;--dark-sq:#b58863;
  --text:#2c1810;--muted:#8a7060;--green:#27ae60;
}
body.dark{
  --bg:#1c1c1c;--panel:#272727;--border:#3a3a3a;
  --accent:#cf4444;--gold:#c49a1a;
  --text:#d4cec8;--muted:#7a7470;--green:#3aaf63;
  background:#1c1c1c;color:#d4cec8;
}
*{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent !important;
  -webkit-touch-callout:none;outline:none;}
html{overscroll-behavior:none;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;padding-bottom:40px;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;}

/* TOP BAR */
.topbar{background:var(--panel);border:1px solid var(--border);
  border-radius:10px;margin:6px 10px;padding:9px 14px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rep-title{font-size:.95rem;font-weight:700;color:var(--text);flex:1;}
.rep-step{font-size:.78rem;font-family:'IBM Plex Mono',monospace;
  color:var(--muted);min-width:55px;text-align:right;}

/* BOARD */
#boardWrap{display:flex;justify-content:center;padding:4px 12px;position:relative;}
#board{display:grid;grid-template-columns:repeat(8,1fr);
  border:3px solid #8b5e3c;border-radius:3px;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.25);margin:0 auto;box-sizing:content-box;}
#arrowSvg{position:absolute;top:0;left:50%;transform:translateX(-50%);
  pointer-events:none;z-index:20;overflow:visible;}
#arrowSvg.drawing-mode{pointer-events:all;cursor:crosshair;}
.square{position:relative;cursor:default;}
.num{position:absolute;top:2px;right:3px;font-size:9px;
  font-family:'IBM Plex Mono',monospace;pointer-events:none;font-weight:700;z-index:1;}
.piece{width:76%;height:76%;border-radius:50%;position:absolute;
  top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;}
.white-p{
  background:radial-gradient(circle at 38% 30%,#ffffff,#f8f0d8 35%,#d4aa60 80%,#b88a30);
  border:3px solid #7a5c28;
  box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 3px 6px rgba(255,255,255,1);}
.black-p{
  background:radial-gradient(circle at 35% 30%,#4a4a4a,#1a1a1a 45%,#050505);
  border:3px solid #888;
  box-shadow:0 4px 10px rgba(0,0,0,.8),inset 0 2px 4px rgba(180,180,180,.2);}
.king::after{content:"♛";position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-size:130%;
  color:#f5c842;text-shadow:0 0 6px #000,0 1px 4px #000;pointer-events:none;}
.sq-last{outline:3px solid #27ae60;outline-offset:-3px;}
.sq-cap{outline:3px solid #c0392b;outline-offset:-3px;}
.sq-next-from{outline:3px solid #f5c842;outline-offset:-3px;
  animation:pulseNext 1s ease-in-out infinite;}
@keyframes pulseNext{0%,100%{outline-color:#f5c842;}50%{outline-color:#ff8c00;}}

/* CONTROLS */
.ctrl-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px 8px;}
.btn{font-family:'Sarabun',sans-serif;font-size:.82rem;font-weight:600;
  padding:7px 14px;border:none;border-radius:8px;cursor:pointer;outline:none;
  -webkit-tap-highlight-color:transparent;-webkit-appearance:none;}
.btn:disabled{opacity:.35;cursor:default;}
.btn-rep{background:#e0d8cc;color:#1a6090;border:1px solid #b0a898;font-weight:700;}
.btn-rep:disabled{opacity:.35;}
body.dark .btn-rep{background:#333;color:#5aaedf;border-color:#484848;}
.btn-sec{background:#e0d8cc;color:var(--text);border:1px solid var(--border);}
body.dark .btn-sec{background:#333;color:#d4cec8;border-color:#484848;}
.btn-arrow{background:#e0d8cc;color:var(--text);border:1px solid var(--border);}
.btn-arrow.active{background:#c0392b;color:#fff;border-color:#c0392b;}
body.dark .btn-arrow{background:#333;color:#d4cec8;border-color:#484848;}

/* PREVIEW (ตาเทพ) */
.btn-preview{background:#e8e0d0;color:#7a5010;border:1px solid #c8a860;font-weight:700;}
.btn-preview.active{background:#c87010;color:#fff;border-color:#c87010;}
body.dark .btn-preview{background:#2e2010;color:#d4a030;border-color:#6a5020;}
body.dark .btn-preview.active{background:#906010;color:#fff;}
.prev-step-wrap{display:flex;align-items:center;gap:4px;}
.prev-step-wrap input[type=range]{width:56px;accent-color:#c87010;}
.prev-step-wrap span{font-size:.75rem;font-family:'IBM Plex Mono',monospace;
  color:var(--muted);min-width:16px;text-align:center;}

/* STATUS */
.status-bar{text-align:center;font-size:.82rem;font-weight:600;
  color:var(--gold);padding:3px 12px 0;min-height:22px;}

/* TOAST */
#toast{position:fixed;top:28px;left:50%;transform:translateX(-50%);
  background:#27ae60;color:#fff;font-family:'Sarabun',sans-serif;
  font-size:.9rem;font-weight:700;padding:10px 24px;border-radius:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:9999;}


/* V1 FORMULA TREE */
#formulaView{display:block;padding:8px 10px 26px}
.formula-header{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:8px}
.formula-header-title{font-size:1.05rem;font-weight:700}
.formula-header-sub{font-size:.76rem;color:var(--muted);margin-top:2px}
.formula-section{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:7px}
.formula-head{width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;text-align:left;padding:12px;font-family:inherit;cursor:pointer}
.formula-head .fa{width:20px;text-align:center}.formula-head .fn{flex:1;font-weight:700;font-size:.94rem}
.formula-head .fc{font-size:.7rem;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:2px 7px}
.formula-body{display:none;border-top:1px solid var(--border);padding:3px 8px 7px 30px}.formula-body.open{display:block}
.formula-game{display:flex;align-items:center;border-bottom:1px solid var(--border)}
.formula-game:last-child{border-bottom:0}
.game-main{flex:1;min-width:0;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:7px;text-align:left;padding:11px 5px;font-family:inherit;cursor:pointer}
.game-main .ga{width:17px;color:var(--muted)}.game-main .gn{font-size:.88rem;font-weight:600;flex:1}.game-main .gm{font-size:.73rem;color:var(--muted)}
.branch-toggle{border:0;background:transparent;color:var(--muted);font-size:17px;padding:8px;cursor:pointer}
.branch-mini{display:none;border-left:2px solid var(--border);margin:0 8px 7px 22px;padding-left:7px}.branch-mini.open{display:block}
.branch-mini button{display:block;width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:8px 6px;border-radius:6px;font-family:inherit;font-size:.82rem;cursor:pointer}
.branch-code{font-weight:700;color:var(--gold);margin-right:7px}
#trainerView{display:none}.formula-back{display:flex;align-items:center;gap:7px;margin:3px 10px 8px}
.formula-back button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 11px;font-family:inherit;font-weight:600;cursor:pointer}
.formula-current{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.branch-choice-v1{display:none;margin:4px 12px 12px;border:2px solid var(--gold);background:var(--panel);border-radius:10px;padding:10px}
.branch-choice-v1.show{display:block}.branch-choice-v1 .bt{font-weight:700;font-size:.9rem}.branch-choice-v1 .bs{font-size:.72rem;color:var(--muted);margin:2px 0 6px}
.branch-choice-v1 button{display:block;width:100%;margin-top:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:9px;text-align:left;font-family:inherit;cursor:pointer}
.v1-empty{padding:15px;text-align:center;color:var(--muted);font-size:.8rem}

</style>
</head>
<body>

<div id="toast"></div>

<script>
/* V2 DATA: loaded from /formulas/index.json */
let FORMULAS = {};
let FORMULA_INDEX = [];
;

    <div class="formula-body">

      <div class="formula-game"><button class="game-main" onclick="loadFormula('สามตัวเรียง VS สองปุ่ม','เกม 2')"><span class="ga">▶</span><span class="gn">เกม 2</span><span class="gm">(23→19)</span></button></div>
      <div class="formula-game"><button class="game-main" onclick="loadFormula('สามตัวเรียง VS สองปุ่ม','เกม 3')"><span class="ga">▶</span><span class="gn">เกม 3</span><span class="gm">(24→20)</span></button></div>

<!-- V1 REPLAY -->

<script>
/* V2 JSON DATA LOADER */
async function loadFormulaIndex(){
  const indexUrl = new URL("./formulas/index.json", document.baseURI).href;
  try{
    const r = await fetch(indexUrl, {cache:"no-store"});
    if(!r.ok) throw new Error("โหลด index.json ไม่สำเร็จ HTTP "+r.status+" : "+indexUrl);
    const index = await r.json();
    FORMULA_INDEX = index;
    FORMULAS = {};

    for(const item of index){
      // item.file is resolved relative to index.json, not index.html.
      const formulaUrl = new URL(item.file, indexUrl).href;
      const fr = await fetch(formulaUrl, {cache:"no-store"});
      if(!fr.ok) throw new Error("โหลดสูตรไม่สำเร็จ HTTP "+fr.status+" : "+formulaUrl);
      FORMULAS[item.name] = await fr.json();
    }
    renderFormulaTreeFromJSON();
  }catch(err){
    console.error("V2 JSON loader error:", err);
    const msg = String(err.message || err);
    document.getElementById("formulaView").innerHTML =
      '<div class="formula-header">' +
      '<div class="formula-header-title">โหลดสูตรไม่สำเร็จ</div>' +
      '<div class="formula-header-sub">ตรวจสอบไฟล์ JSON และ path ของ GitHub Pages</div>' +
      '</div>' +
      '<div class="v1-empty" style="text-align:left;word-break:break-word;">' +
      '<b>สาเหตุ:</b><br>' + msg.replace(/</g,"&lt;").replace(/>/g,"&gt;") +
      '<br><br><b>ตำแหน่งที่ต้องมี:</b><br>' +
      'checkers/index.html<br>' +
      'checkers/formulas/index.json<br>' +
      'checkers/formulas/*.json' +
      '</div>';
  }
}
function renderFormulaTreeFromJSON(){
  const root=document.getElementById("formulaView");
  const header=`<div class="formula-header"><div class="formula-header-title">สูตรหมากฮอส</div><div class="formula-header-sub">เลือกสูตร → เลือกเกม → ฝึกด้วย Next</div></div>`;
  const sections=FORMULA_INDEX.map((item,si)=>{
    const games=FORMULAS[item.name]||{};
    const gameNames=Object.keys(games);
    const open=si===1;
    const body=gameNames.map(g=>{
      const rec=games[g];
      const firstMove=(rec.moves?.[0]||"").split(" ").pop()||"";
      return `<div class="formula-game"><button class="game-main" onclick="loadFormula(${JSON.stringify(item.name)},${JSON.stringify(g)})"><span class="ga">▶</span><span class="gn">${g}</span><span class="gm">${firstMove?`(${firstMove})`:""}</span></button></div>`;
    }).join("");
    return `<section class="formula-section"><button class="formula-head" onclick="toggleFormulaSection(this)"><span class="fa">${open?"▼":"▶"}</span><span class="fn">${item.name}</span><span class="fc">${gameNames.length} เกม</span></button><div class="formula-body ${open?"open":""}">${body}</div></section>`;
  }).join("");
  root.innerHTML=header+sections+'<div class="v1-empty">สูตรถูกโหลดจาก JSON — เพิ่มสูตรโดยแก้ไฟล์ข้อมูล ไม่ต้องแก้ JavaScript</div>';
}

/* V1 FORMULA TREE */
let currentFormulaName="", currentGameName="";
function toggleFormulaSection(btn){
  const body=btn.nextElementSibling, arrow=btn.querySelector(".fa");
  const open=body.classList.toggle("open"); arrow.textContent=open?"▼":"▶";
}
function toggleMiniBranch(id){document.getElementById(id)?.classList.toggle("open");}
function getTimeline(formula, game){
  let baseGame=game.includes(" • ")?game.split(" • ")[0]:game;
  const rec=FORMULAS[formula]?.[baseGame];
  if(!rec) return null;
  let moves=[...rec.moves];
  if(game.includes(" • ")){
    const branch=game.split(" • ")[1];
    const branchFirst={ "ทาง A":"black 30-25", "ทาง B":"black 30-26", "ทาง C":"black 29-25" }[branch];
    if(branchFirst && moves.length) moves[0]=branchFirst;
  }
  return [
    "@name:"+formula+" — "+game,
    "@white:"+rec.white.join(","),
    "@black:"+rec.black.join(","),
    "@first:"+(rec.first||"black"),
    ...moves
  ].join("\n");
}
function loadFormula(formula,game){
  const timeline=getTimeline(formula,game);
  if(!timeline){showToast("ไม่พบสูตร");return;}
  stop(); currentFormulaName=formula; currentGameName=game;
  document.getElementById("formulaView").style.display="none";
  document.getElementById("trainerView").style.display="block";
  document.getElementById("formulaCurrent").textContent=formula+" › "+game;
  parseTimeline(timeline);
  document.getElementById("branchChoiceV1").classList.remove("show");
  window.scrollTo({top:0,behavior:"smooth"});
}
function showFormulaTree(){
  stop(); document.getElementById("trainerView").style.display="none";
  document.getElementById("formulaView").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}
function showV1Branch(){
  const p=document.getElementById("branchChoiceV1");
  if([8,19].includes(step)) p.classList.add("show"); else p.classList.remove("show");
}
function chooseV1Branch(branch){
  document.getElementById("branchChoiceV1").classList.remove("show");
  showToast("เลือกทาง "+branch+" — ข้อมูลจำลอง V1");
}

/* ══ INIT ══ */
document.getElementById("formulaView").style.display="block";
document.getElementById("trainerView").style.display="none";
drawBoard();
resizeBoard();
render();
loadFormulaIndex();
</script>
