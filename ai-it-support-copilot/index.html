<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI IT Support Copilot
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

        <div>

            <h1>
                🤖 AI IT Support Copilot
            </h1>

            <p>
                AI Native IT Support — Phase 2
            </p>

        </div>


        <div class="status">

            ● SUPABASE CONNECTED

        </div>

    </header>



    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="container">


        <!-- =================================
             CREATE TICKET
        ================================== -->

        <section class="card">


            <div class="card-title">

                <span>
                    01
                </span>

                <h2>
                    รับแจ้งปัญหา
                </h2>

            </div>



            <!-- USER -->

            <label for="userName">

                ผู้แจ้ง

            </label>


            <input
                type="text"
                id="userName"
                value="สมชาย - สาขา A"
                placeholder="ชื่อผู้แจ้ง"
            >



            <!-- SYSTEM -->

            <label for="systemType">

                ระบบ / อุปกรณ์

            </label>


            <select id="systemType">

                <option value="Handheld + Web Application">

                    Handheld + Web Application

                </option>


                <option value="Wi-Fi">

                    Wi-Fi

                </option>


                <option value="Printer">

                    Printer

                </option>


                <option value="PC / Windows">

                    PC / Windows

                </option>


                <option value="Network">

                    Network

                </option>


            </select>



            <!-- PROBLEM -->

            <label for="problem">

                รายละเอียดปัญหา

            </label>


            <textarea
                id="problem"
                placeholder="อธิบายปัญหาที่ User พบ..."
            >Handheld บันทึกข้อมูลช้ามาก กดบันทึก 1 รายการใช้เวลาประมาณ 5 นาที และถ้าบันทึกหลายรายการอาจใช้เวลาถึง 40 นาที แต่เกิดเฉพาะสาขา A</textarea>



            <!-- PRIORITY -->

            <label for="priority">

                Priority

            </label>


            <select id="priority">

                <option value="Low">

                    Low

                </option>


                <option
                    value="Medium"
                    selected
                >

                    Medium

                </option>


                <option value="High">

                    High

                </option>


                <option value="Critical">

                    Critical

                </option>

            </select>



            <!-- BUTTON -->

            <button
                class="btn-primary"
                id="createTicketButton"
                onclick="createTicket()"
            >

                🎫 Create Ticket

            </button>


        </section>



        <!-- =================================
             RESULT
        ================================== -->

        <section class="card">


            <div class="card-title">

                <span>
                    02
                </span>

                <h2>
                    Ticket Result
                </h2>

            </div>



            <!-- PROGRESS -->

            <div class="progress-container">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>



            <!-- STATUS -->

            <div
                id="status"
                class="status-box"
            >

                🟢 พร้อมสร้าง Ticket

            </div>



            <!-- RESULT -->

            <div
                id="result"
                class="result"
            >

                <div class="empty">

                    🎫

                    <h3>
                        Create Ticket
                    </h3>

                    <p>
                        กรอกข้อมูลทางด้านซ้าย
                        แล้วกด Create Ticket
                    </p>

                </div>

            </div>


        </section>


    </main>



    <!-- =====================================
         WORKFLOW
    ====================================== -->

    <section class="workflow">


        <h2>
            🔄 Phase 2 Workflow
        </h2>


        <div class="workflow-grid">


            <div class="workflow-item">

                <strong>
                    1
                </strong>

                <span>
                    User Problem
                </span>

            </div>


            <div class="arrow">
                →
            </div>


            <div class="workflow-item">

                <strong>
                    2
                </strong>

                <span>
                    Create Ticket
                </span>

            </div>


            <div class="arrow">
                →
            </div>


            <div class="workflow-item">

                <strong>
                    3
                </strong>

                <span>
                    Supabase
                </span>

            </div>


            <div class="arrow">
                →
            </div>


            <div class="workflow-item">

                <strong>
                    4
                </strong>

                <span>
                    PostgreSQL
                </span>

            </div>


            <div class="arrow">
                →
            </div>


            <div class="workflow-item">

                <strong>
                    5
                </strong>

                <span>
                    Ticket Saved
                </span>

            </div>


        </div>


    </section>


</div>



<!-- =====================================
     SUPABASE JAVASCRIPT LIBRARY
====================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>



<!-- =====================================
     APPLICATION JAVASCRIPT
====================================== -->

<script src="app.js"></script>


</body>

</html>
